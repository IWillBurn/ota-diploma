# otabench A/B boot script. Implements the variables of RAUC's GRUB backend:
#   ORDER="A B"   boot order, first entry is primary
#   <S>_OK=1      slot is bootable          <S>_TRY=1  slot was tried and not confirmed
# GRUB picks the first slot in ORDER with OK=1 and TRY=0, sets its TRY=1 *before*
# booting it; userspace confirms a good boot with `rauc status mark-good`
# (OK=1, TRY=0). An unconfirmed boot therefore falls back to the other slot.
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=0

# defaults if grubenv is missing or unreadable
set ORDER="A B"
set A_OK=0
set A_TRY=0
set B_OK=0
set B_TRY=0
load_env

set SELECTED=""
for SLOT in $ORDER; do
    if [ -z "$SELECTED" ]; then
        if [ "$SLOT" = "A" ]; then
            if [ "$A_OK" = "1" -a "$A_TRY" = "0" ]; then
                set SELECTED=A
                set A_TRY=1
            fi
        fi
        if [ "$SLOT" = "B" ]; then
            if [ "$B_OK" = "1" -a "$B_TRY" = "0" ]; then
                set SELECTED=B
                set B_TRY=1
            fi
        fi
    fi
done

if [ -z "$SELECTED" ]; then
    set SELECTED=A
    echo "otabench-grub: RESCUE (no slot is OK and untried)"
fi
save_env A_TRY B_TRY
echo "otabench-grub: ORDER=[$ORDER] A_OK=$A_OK A_TRY=$A_TRY B_OK=$B_OK B_TRY=$B_TRY -> $SELECTED"

set CMDLINE="rw console=tty0 console=ttyS0,115200n8 consoleblank=0 panic=5 quiet"
if [ "$SELECTED" = "B" ]; then
    linux (hd0,gpt2)/boot/vmlinuz-@KVER@ root=/dev/vda2 $CMDLINE rauc.slot=B
    initrd (hd0,gpt2)/boot/initrd.img-@KVER@
else
    linux (hd0,gpt1)/boot/vmlinuz-@KVER@ root=/dev/vda1 $CMDLINE rauc.slot=A
    initrd (hd0,gpt1)/boot/initrd.img-@KVER@
fi
boot
echo "otabench-grub: BOOT FAILED for $SELECTED"
sleep 5
reboot
