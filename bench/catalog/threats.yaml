  - id: OTA-PWR-06
    title: Power loss corrupts the RUNNING slot (writable rootfs) during an update
    class: fault-tolerance
    property: the A/B fallback target stays intact while the inactive slot is written
    attacker: fault
    ecosystems: [ab-updater]
    refs:
      unr156: ["7.2.2.1.1 'restore systems to their previous version in case of a failed or interrupted update' (impossible when the previous version itself is corrupted)"]
      nist800193: ["4.1.2(2) operational or recoverable after power loss in the middle of a flash write", "4.4.1 recovery obtains an authentic image"]
      verified: true  # 2026-11-01: wording checked against the quotes in research_notes/.../regulation_and_standards.md
    # observed only under the sector-atomicity (--torn) model: torn ext4 journal block of slot A
    # -> "error loading journal" -> root unmountable -> panic loop; mitigations: read-only rootfs,
    # 4 KiB atomic writes / eMMC reliable write, fsck in initramfs
    expected: survive
    coverage: {}
    bench: [ab:reorder:* --torn]
    level: block

