  - id: OTA-PWR-05
    title: Power loss leaves the update state unusable (device boots but can no longer be updated)
    class: fault-tolerance
    property: recoverability of the update capability itself (liveness), not only bootability
    attacker: fault
    ecosystems: [ab-updater]
    refs:
      unr156: ["7.2.2.1.1 restore previous version or safe state after a failed or interrupted update (≈: requires a usable state, not explicitly the ability to update again)"]
      nist800193: ["4.1.2(2) the RTU/CTU 'shall always be operational or recoverable upon a subsequent reboot even in the event of ... power loss in the middle of a flash write operation' (the update mechanism itself must survive)"]
      cra: ["Annex I Part I (2)(c) 'ensure that vulnerabilities can be addressed through security updates' (a device that can no longer be updated cannot meet it)", "Annex I Part I (2)(h) availability also after an incident (by interpretation)"]
      verified: true  # 2026-11-01: wording checked against the quotes in research_notes/.../regulation_and_standards.md
