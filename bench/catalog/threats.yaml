      suit: ["≈ THREAT.NET.ONPATH (modified or not delivered)", "RFC 9019 §3 mechanisms to resume interrupted or corrupted transfers", "draft-ietf-suit-manifest-37 §6.3.1 Resilience to Disruption"]
      isvs: ["3.4.7 on update failure revert to a backup image or notify"]
      cra: ["Annex I Part I (2)(h) availability also after an incident (fail-safe by interpretation)"]
      etsi303645: ["TS 103 701 5.3-2-2 NOTE 1: resume the update after a failed step (test example)"]
      unr156: ["7.2.2.1.1 restore previous version or safe state after a failed or interrupted update"]
      verified: true
    expected: survive
    coverage:
      mender-integration: [test_image_download_retry_timeout, test_image_download_retry_download_count, test_image_download_retry_hosts_broken, test_deployed_during_network_outage]
      aktualizr-tests: [test_io_failure.py]
