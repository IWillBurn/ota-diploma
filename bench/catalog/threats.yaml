# otabench threat catalog (machine-readable)
#
# One entry = one attack or failure the update system must withstand.
# Fields:
#   id            stable identifier, OTA-<CLASS>-<NN>
#   title         short name
#   class         authenticity | freshness | key-compromise | availability |
#                 fault-tolerance | installation | parsing | confidentiality
#   property      the security/resilience property that is violated
#   attacker      capability model: net (MitM / malicious mirror, no keys),
#                 online-keys (timestamp/snapshot or director keys), offline-keys,
#                 fault (no attacker: power loss, network loss)
#   ecosystems    where the threat applies: tuf, uptane, suit, ab-updater
#   refs          clause references per source. Values are strings so that a
#                 human can follow them; `verified: false` marks references that
#                 still need checking against the primary text. A source key is
#                 omitted when the notes found no clause for it (NOT FOUND).
#                 "≈" = closest clause, not equivalent. Source keys:
#                   tuf          TUF specification 1.0.37 (tag v1.0.37), §-numbers
#                   uptane       Uptane Standard 2.1.0, §-numbers ("s" = step);
#                                DEPLOY = Uptane Deployment Best Practices;
#                                RAID 2024 = Lorch et al., DOI 10.1145/3678890.3678927
#                   suit         RFC 9124 THREAT.* / REQ.* identifiers; RFC 9019 and
#                                draft-ietf-suit-manifest-37 where named explicitly
#                   isvs         OWASP ISVS 1.0 requirement IDs
#                   cra          Regulation (EU) 2024/2847 (Cyber Resilience Act)
#                   en18031      EN 18031-1:2024 (RED Delegated Regulation 2022/30)
#                   etsi303645   ETSI EN 303 645 V3.1.3; "TS 103 701" = its test
#                                specification V2.1.1
#                   unr156       UN Regulation No. 156 (ECE/TRANS/WP.29/2020/80)
#                   nist800193   NIST SP 800-193 (May 2018)
#                   fstec117     Приказ ФСТЭК России от 11.04.2025 № 117
#                   fstec239     Приказ ФСТЭК России от 25.12.2017 № 239 (ред. 28.08.2024)
#                   fstec_method Методика тестирования обновлений безопасности
#                                программных, программно-аппаратных средств
#                                (ФСТЭК России, 28.10.2022)
#   spec_status   optional, per source key: the source explicitly does NOT require
#                 the defence (removed, non-goal, optional/MAY, informative only,
#                 restricted to one level)
#   expected      what the spec demands: block | survive | out-of-scope
#   coverage      which EXISTING test suites exercise it (test names):
#                   tuf-conformance     test functions in tuf_conformance/test_*.py
#                   oss-fuzz            <project>/<fuzzer>
#                   mcuboot-sim         mcu-tools/mcuboot sim/tests/core.rs (sim_test! names)
#                   mender-integration  mendersoftware/integration tests/tests/
#                   aktualizr-tests     uptane/aktualizr tests/
#                 every test name above was checked to exist on 2026-11-01 against
#                 mcuboot a9767a0, integration b68cbab, aktualizr e5118a7 (sparse
#                 clones in third_party/verify); what each test asserts: docs/external-tests.md
#                 (two MCUboot tests are weaker than their names, per their own FIXME/TODO).
#   bench         otabench scenario ids that exercise it ([] = not yet);
#                 `ab:<name>` = scenario of the RAUC A/B pilot: scripts/pilot_ab.py
#                 (`ab:window:*`, `ab:reorder:*` = all /boot-ab configurations), or
#                 scripts/replay_state.py for `ab:replay-state-liveness`;
#                 `suit-*` = SUIT profile, scripts/suit_bench.py (libcsuit)
#   id prefix     a mnemonic of the threat family (NET, REP, AUTHZ, TIME …); it is not
#                 required to equal `class` (e.g. OTA-NET-01 is class fault-tolerance)
#   level         for fault tolerance: process | block | system
#
# NOTE (0.3.0, 2026-11-01): OTA-PWR-05 and OTA-PWR-06 added from the A/B pilot results
# (40 threats); the file is validated against threats.schema.json. All 40 entries now have
# verified references (PWR-05, PWR-06, NET-02 checked last).
# NOTE (0.2.0): refs replaced with the clause references recorded in
# research_notes/Бенчмарк безопасности OTA обновлений/specs_threat_models.md
# (§7 cross-walk, §7.2 proposed IDs) and regulation_and_standards.md (§7
# requirement -> property table). Coverage checked against the tuf-conformance
# sources and conformance_suites_and_implementations.md / power_loss_and_fuzzing.md.
# Regulatory refs map a threat to a requirement through the property it protects
# (Au/In/AR/KC/At/Rec/Av); this is an interpretation, not literal text. No reviewed
# regulation requires freshness (anti-freeze), mix-and-match or fast-forward
# protection, so those entries carry no regulatory keys. UN R155 (key compromise
# 12.4, DoS 13.1, downgrade-by-replay 6.3) has no key in this schema.
# OTA-INST-03 .. OTA-PARSE-02 are the classes proposed in specs_threat_models.md §7.2.

version: 0.3.0
threats:

  # ---------------------------------------------------------------- authenticity
  - id: OTA-AUTH-01
    title: Arbitrary software installation (artifact substitution)
    class: authenticity
    property: integrity and authenticity of the artifact
    attacker: net
    ecosystems: [tuf, uptane, suit, ab-updater]
    refs:
      tuf: ["§1.5.2 'Arbitrary installation attacks', 'Wrong software installation'", "§5.7.1–5.7.3 target length and hashes", "§4.5 targets LENGTH, HASHES"]
      uptane: ["§4.3.4 'Arbitrary software attack'", "§5.4.2.4", "§5.4.3.4 s7 image hashes; length SHALL match", "§5.4.4.2 s10.2.1 Director/Image targets match"]
      suit: ["THREAT.IMG.NON_AUTH → REQ.SEC.AUTHENTIC (§3.13 Payload Digests)", "THREAT.IMG.REPLACE → REQ.SEC.AUTH.EXEC", "THREAT.NET.REDIRECT → REQ.SEC.AUTH.REMOTE_LOC"]
      isvs: ["3.4.3 updates signed by a trusted source, authenticity verified before execution", "3.4.4 no TOCTOU between validation and applying the update"]
      cra: ["Annex I Part I (2)(f) integrity of programs against unauthorised modification", "Annex I Part II (7) mechanisms to securely distribute updates"]
      en18031: ["6.3.2 [SUM-2] install only software whose integrity and authenticity are valid", "6.3.2.4.6.3 [AU.SUM-2.Sign] unsigned, modified-signature, modified-payload, unauthorised-signer updates not installed"]
      etsi303645: ["5.3-10 (M) verify authenticity and integrity of each update via a trust relationship", "5.3-9 (R) verify authenticity and integrity of updates", "TS 103 701 5.3-2-2 NOTE 1: change one byte in a signed firmware"]
      unr156: ["7.2.1.1 authenticity and integrity of software updates protected"]
      nist800193: ["4.2.1.1(2) update signed by an authorized entity", "4.2.1.1(3) signature verified before non-volatile storage completion"]
      fstec117: ["п. 39 проверка подлинности и целостности обновлений"]
      fstec239: ["ОПО.1 получение обновлений от доверенного источника", "ОПО.2 контроль целостности обновлений ПО"]
      fstec_method: ["Т002 проверка подлинности обновлений (п. 3.3.2)", "Т001 сверка идентичности обновлений из разных источников (п. 3.2)"]
      verified: true
    expected: block
    coverage:
      tuf-conformance: [test_repository_substitutes_target_file, test_multiple_changes_to_target]
      mcuboot-sim: [bad_secondary_slot]
      mender-integration: [test_unsigned_artifact_fails_deployment]
    bench: [arb-target-substitution, online-keys-arbitrary, ab:attacker, ab:net-tamper, suit-payload-substitution]

  - id: OTA-AUTH-02
    title: Metadata tampering without keys
    class: authenticity
    property: authenticity of metadata / manifest
    attacker: net
    ecosystems: [tuf, uptane, suit, ab-updater]
    refs:
      tuf: ["§5.3.4, §5.4.2, §5.5.3, §5.6.3 threshold signatures ('Check for an arbitrary software attack')", "§5.5.2, §5.6.2 hash vs parent listing"]
      uptane: ["§5.4.4.3 s2.3, §5.4.4.4 s2, §5.4.4.5 s2–s3, §5.4.4.6 s3 signature checks", "§5.4.4.6 s6–s8 Director Targets constraints"]
      suit: ["THREAT.NET.ONPATH, THREAT.IMG.NON_AUTH → REQ.SEC.AUTHENTIC", "THREAT.MFST.OVERRIDE → REQ.SEC.ACCESS_CONTROL"]
      isvs: ["3.4.3 updates signed by a trusted source, authenticity verified before execution"]
      cra: ["Annex I Part I (2)(f) integrity of programs against unauthorised modification", "Annex I Part II (7) mechanisms to securely distribute updates"]
      en18031: ["6.3.2.4.6.3 [AU.SUM-2.Sign] update with a modified signature not installed", "[AU.SUM-2.SecChan] update modified during communication not installed"]
      etsi303645: ["5.3-10 (M) verify authenticity and integrity of each update via a trust relationship"]
      unr156: ["7.2.1.1 authenticity and integrity of software updates protected"]
      nist800193: ["4.2.1.1(3) signature verified before non-volatile storage completion"]
      fstec117: ["п. 39 проверка подлинности и целостности обновлений"]
      fstec239: ["ОПО.2 контроль целостности обновлений ПО"]
      fstec_method: ["Т002 проверка подлинности обновлений (п. 3.3.2)"]
      verified: true
    expected: block
    coverage:
      tuf-conformance: [test_unsigned_metadata, test_snapshot_does_not_meet_threshold, test_snapshot_has_too_few_keys, test_incorrect_metadata_type]
    bench: [arb-metadata-tamper, suit-manifest-tamper, suit-signature-tamper, rauc-sigcover]

  - id: OTA-AUTH-03
    title: Signature / keyid confusion
    class: authenticity
    property: binding of signatures to trusted keys
    attacker: net
    ecosystems: [tuf, uptane, suit]
    refs:
      tuf: ["§4.2.1 KEYID = SHA-256 of canonical key; 'MUST be unique in the signatures array'", "§5.3.4, §5.4.2, §5.5.3, §5.6.3 each KEY contributes one SIGNATURE to the threshold", "TAP 9, TAP 12"]
      uptane: ["§5.2.1 public key identifier", "§5.2.2 'Each key SHALL have a unique public key identifier'", "threshold of unique keys: §5.4.4.3 s2.3, §5.4.4.4 s2, §5.4.4.5 s3, §5.4.4.6 s3"]
      suit: ["REQ.SEC.AUTHENTIC (§3.15 Signature)", "REQ.USE.MFST.MULTI_AUTH; no dedicated THREAT"]
      isvs: ["3.4.3 (generic)", "1.3.13 debug and release images signed with different keys"]
      en18031: ["6.3.2.4.6.3 [AU.SUM-2.Sign] update signed by an unauthorized entity not installed"]
      etsi303645: ["5.3-7 (M) best practice cryptography for secure update"]
      nist800193: ["4.2.1.1(2) update signed by an authorized entity"]
      verified: true
    expected: block
    coverage:
      tuf-conformance: [test_duplicate_sig_keyids, test_duplicate_keys, test_invalid_sig_in_valid_metadata]
    bench: [arb-keyid-spoofing, threshold-key-twice]

  # ---------------------------------------------------------------- freshness
  - id: OTA-FRESH-01
    title: Indefinite freeze (replay of expired metadata)
    class: freshness
    property: freshness
    attacker: net
    ecosystems: [tuf, uptane, suit]
    refs:
      tuf: ["§1.5.2 'Indefinite freeze attacks'", "§5.1 fixed update start time", "§5.3.10, §5.4.4, §5.5.6, §5.6.5 'Check for a freeze attack'", "§6.1 withheld root bounded by root expiry"]
      uptane: ["§4.3.2 'Freeze attack'", "§5.4 ECUs SHALL have a secure source of time", "§5.4.4.3 s3, §5.4.4.4 s4, §5.4.4.5 s7, §5.4.4.6 s5 freeze checks", "§5.2.3.1 vehicle identifier in image-less Director Targets"]
      suit: ["THREAT.IMG.EXPIRED.OFFLINE → REQ.SEC.EXP, REQ.USE.MFST.PRE_CHECK"]
      verified: true
    spec_status:
      suit: "expiry optional: REQ.SEC.EXP says a manifest MAY expire"
    expected: block
    coverage:
      tuf-conformance: [test_timestamp_expired, test_snapshot_expired, test_targets_expired, test_root_expired]
    bench: [freeze-expired-timestamp, online-keys-freeze]

  - id: OTA-FRESH-02
    title: Rollback (replay of older validly signed metadata / firmware)
    class: freshness
    property: anti-rollback
    attacker: net
    ecosystems: [tuf, uptane, suit, ab-updater]
    refs:
      tuf: ["§1.5.2 'Rollback attacks'", "§5.3.5 root version exactly N+1", "§5.4.3.1 timestamp version strictly greater (equal: abort without error)", "§5.4.3.2 snapshot version non-decreasing", "§5.5.5 targets versions non-decreasing, listed targets kept"]
      uptane: ["§4.3.3 'Rollback attack'", "§5.4.4.3 s2.4, §5.4.4.4 s3 (accepts equal version), §5.4.4.5 s4–s6, §5.4.4.6 s4", "release counter: §5.2.3.1.1, §5.4.3.4 s5, §5.4.4.2 s10.2.3"]
      suit: ["THREAT.IMG.EXPIRED → REQ.SEC.SEQUENCE (manifest sequence number, not image version)", "draft-ietf-suit-manifest-37 §8.4.2 suit-manifest-sequence-number"]
      isvs: ["3.4.6 device cannot be downgraded to known vulnerable versions (L3)"]
      etsi303645: ["§5.3 EXAMPLE 7 (informative): anti-rollback by version checking", "TS 103 701 5.3-2-1 EXAMPLE, 5.3-2-2 NOTE 1: install an older vulnerable firmware"]
      nist800193: ["4.2.1.3(2) prevent unauthorized update to an earlier authentic version", "4.4.1(13) recovery should not restore an earlier vulnerable version"]
      verified: true
    spec_status:
      tuf: "timestamp version strictly greater; an equal version stops the update without error and keeps the trusted timestamp (§5.4.3.1); snapshot and targets non-decreasing"
      uptane: "full verification accepts an equal version (§5.4.4.4 s3); images are protected by release counters (§5.2.3.1.1), not by metadata versions"
      suit: "rollback protection via the manifest sequence number, not the image version"
      isvs: "required at L3 only (3.4.6)"
      etsi303645: "informative only (EXAMPLE 7; TS 103 701 test examples)"
    expected: block
    coverage:
      tuf-conformance: [test_new_timestamp_version_rollback, test_snapshot_rollback, test_targets_rollback, test_targets_role_removal, test_timestamp_content_changes]
      mcuboot-sim: [downgrade_prevention, hw_prot_failed_security_cnt_check]
    bench: [rollback-timestamp, timestamp-same-version, online-keys-downgrade, ab:downgrade]

  - id: OTA-FRESH-03
    title: Mix-and-match
    class: freshness
    property: consistency of the metadata set
    attacker: net
    ecosystems: [tuf, uptane]
    refs:
      tuf: ["§1.5.2 'Mix-and-match attacks' (metadata combination)", "§2.1.3", "§5.5.2, §5.6.2 hashes vs parent listing", "§5.5.4, §5.6.4 versions vs parent listing"]
      uptane: ["§4.3.3 'Mix-and-match attack' (incompatible images, not metadata)", "§5.4.4.5 s2, §5.4.4.6 s2 'Checks for a mix-and-match attack'", "§5.3.2.1 s5 Director SHALL consider dependencies/conflicts"]
      verified: true
    expected: block
    coverage:
      tuf-conformance: [test_url_and_metadata_version_mismatch, test_snapshot_hash_mismatch, test_targets_hash_mismatch, test_delegation_not_in_snapshot]
    bench: [mix-and-match]

  - id: OTA-FRESH-04
    title: Fast-forward (attacker-inflated version locks out recovery)
    class: freshness
    property: recoverability after online-key compromise
    attacker: online-keys
    ecosystems: [tuf, uptane]
    refs:
      tuf: ["§1.5.2 'Fast-forward attacks'", "§5.3.11 delete trusted timestamp/snapshot after key rotation (recovery)", "§5.5.4, §5.6.4 version equality"]
      uptane: ["§5.4.4.3 s4 recovery from fast-forward attacks [MERCURY]; not in the §4.3 list"]
      verified: true
    expected: block
    coverage:
      tuf-conformance: [test_new_timestamp_fast_forward_recovery, test_new_snapshot_fast_forward_recovery, test_targets_fast_forward_recovery]
    bench: []
    bench_gap: "TUF: covered by the tuf-conformance fast-forward recovery tests, a copy would add no signal; the Uptane variant needs a Director repository."

  # ---------------------------------------------------------------- key compromise
  - id: OTA-KEY-01
    title: Online-key compromise -> downgrade to older firmware
    class: key-compromise
    property: compromise resilience (online keys)
    attacker: online-keys
    ecosystems: [tuf, uptane]
    refs:
      tuf: ["§1.5 online keys not used for roles clients ultimately trust", "§1.5.2 'Vulnerability to key compromises'", "§5.4.3.1–5.4.3.2, §5.5.5 checks against persisted trusted versions"]
      uptane: ["§4.2 attacker compromises Director or Image repository, not both", "§5.2.3.1.1 release counter, 'even in cases where the Director repository is compromised'", "§5.4.4.2 s10.2.3 release counter non-decreasing", "DEPLOY 'Preventing rollback attacks in case of Director compromise'"]
      suit: ["THREAT.KEY.EXPOSURE → REQ.SEC.KEY.PROTECTION, REQ.SEC.KEY.ROTATION", "THREAT.IMG.EXPIRED → REQ.SEC.SEQUENCE"]
      isvs: ["3.4.6 anti-rollback (L3)", "1.5.2 response strategy for compromised credentials"]
      nist800193: ["4.2.1.3(2) prevent unauthorized update to an earlier authentic version"]
      verified: true
    spec_status:
      isvs: "anti-rollback required at L3 only (3.4.6)"
    expected: block
    coverage:
      tuf-conformance: [test_snapshot_rollback, test_targets_rollback]
    bench: [online-keys-downgrade]

  - id: OTA-KEY-02
    title: Online-key compromise -> arbitrary software
    class: key-compromise
    property: compromise resilience (online keys)
    attacker: online-keys
    ecosystems: [tuf, uptane]
    refs:
      tuf: ["§1.5 online keys not used for roles clients ultimately trust", "§2.1.4", "§5.6.3 targets threshold from root", "§5.7.3"]
      uptane: ["§4.2", "§5.4 Primary SHALL perform full verification", "§5.4.4.2 s10 Director vs Image targets match", "DEPLOY ecus.md: partial-verification ECUs can be told to install malicious software with the Director Targets key"]
      suit: ["THREAT.KEY.EXPOSURE → REQ.SEC.KEY.PROTECTION", "THREAT.UPD.UNAPPROVED → REQ.SEC.RIGHTS"]
      isvs: ["3.4.3", "1.5.2 response strategy for compromised credentials"]
      verified: true
    spec_status:
      uptane: "not required for partial-verification Secondaries (§5.4.4.1 checks Director Targets only)"
    expected: block
    coverage: {}
    bench: [online-keys-arbitrary, threshold-key-twice]

  - id: OTA-KEY-03
    title: Compromised key not revoked after root rotation
    class: key-compromise
    property: key revocation
    attacker: offline-keys
    ecosystems: [tuf, uptane, suit]
    refs:
      tuf: ["§1.5.3 'All keys must be easily and safely revocable'", "§5.3.1–5.3.9 root chain N→N+1, dual threshold (§5.3.4)", "§5.3.11", "§6.1 key management and migration", "TAP 8, TAP 20 (Accepted; not in the §1.5.4 list)"]
      uptane: ["§5.4.4.3 s2 root chain, s4", "§5.4.4.1 note: optional Director Root check for Targets-key rotation", "DEPLOY key_management.md: Root revokes/replaces keys"]
      suit: ["REQ.SEC.KEY.ROTATION", "REQ.USE.DELEGATION (§3.25 Delegation Chain)"]
      isvs: ["1.5.2 response strategy for compromised credentials (process only)", "≈ 2.1.11 device credentials"]
      nist800193: ["4.1.2(4) key store updated via authenticated update; note: recovers from signing-key compromise"]
      verified: true
    expected: block
    coverage:
      tuf-conformance: [test_root_rotation, test_non_root_rotations]
    bench: []
    bench_gap: "TUF: covered by the tuf-conformance rotation tests; SUIT and Uptane key rotation need implementations with persistent trust anchors (the libcsuit example keeps none)."

  - id: OTA-KEY-04
    title: Online-key compromise -> indefinite freeze with fresh signatures
    class: key-compromise
    property: freshness under compromise
    attacker: online-keys
    ecosystems: [tuf, uptane]
    refs:
      tuf: ["§2.1.4", "§5.4.3.2, §5.5.5 no version regression", "§5.5.6, §5.6.5 expiry of snapshot/targets bounds the freeze", "§6.1"]
      uptane: ["§4.3.2 'Freeze attack'", "§5.4.4.6 s5", "DEPLOY key_management.md: longer expiry gives 'more time to execute freeze attacks'"]
      suit: ["≈ THREAT.KEY.EXPOSURE + REQ.SEC.EXP"]
      verified: true
    expected: out-of-scope
    coverage: {}
    bench: [online-keys-freeze]

  # ---------------------------------------------------------------- availability
  - id: OTA-DOS-01
    title: Endless data (metadata)
    class: availability
    property: bounded resource use
    attacker: net
    ecosystems: [tuf, uptane, suit, ab-updater]
    refs:
      tuf: ["§1.5.2 'Endless data attacks'", "§5.3.3 W bytes per root, at most Y root files", "§5.4.1 X bytes", "§5.5.1 length from timestamp or Y bytes", "§5.6.1 length from snapshot or Z bytes", "§5.6.7.1 max roles visited"]
      uptane: ["§4.3.3 'Endless data attack'", "§5.4.4.3 s2.2 (X), §5.4.4.4 s1 (Y), §5.4.4.5 s1, §5.4.4.6 s1 (Z)"]
      cra: ["Annex I Part I (2)(h) availability; resilience against denial-of-service attacks"]
      verified: true
    expected: block
    coverage: {}
    bench: [endless-metadata]

  - id: OTA-DOS-02
    title: Endless data (artifact beyond signed length)
    class: availability
    property: bounded resource use
    attacker: net
    ecosystems: [tuf, uptane, suit, ab-updater]
    refs:
      tuf: ["§5.7.3 download up to the length in targets metadata", "§4.5 LENGTH"]
      uptane: ["§5.4.3.3 s4 download up to the length in Targets metadata", "§5.4.3.4 length SHALL match", "§5.2.3.1 image size"]
      suit: ["≈ THREAT.IMG.EXTRA → REQ.SEC.IMG.COMPLETE_DIGEST", "≈ §3.14 Size (REQ.SEC.AUTH.EXEC)"]
      cra: ["Annex I Part I (2)(h) availability; resilience against denial-of-service attacks"]
      verified: true
    expected: block
    coverage: {}
    bench: [endless-artifact, ab:net-endless]

  - id: OTA-DOS-03
    title: Slow retrieval (metadata)
    class: availability
    property: bounded update latency
    attacker: net
    ecosystems: [tuf, uptane, suit, ab-updater]
    refs:
      tuf: ["note: not in 1.0.37. §1.5.2 'Slow retrieval attacks' removed by commit f9122f1 (J. Lock, 2020-09-08), PR #111, first released in v1.0.7 (last listed in v1.0.6)"]
      uptane: ["§4.3.2 'Slow retrieval attack'", "§5.4 'All ECUs SHALL monitor the download speed of image metadata ... to detect and respond to a slow retrieval attack' (SHALL since 2.0.0; alert to Director SHOULD; no numeric threshold)"]
      cra: ["Annex I Part I (2)(h) availability; resilience against denial-of-service attacks"]
      verified: true
    spec_status:
      tuf: "not required since v1.0.7"
    expected: block
    coverage: {}
    bench: [slow-metadata]

  - id: OTA-DOS-04
    title: Slow retrieval (artifact)
    class: availability
    property: bounded update latency
    attacker: net
    ecosystems: [tuf, uptane, suit, ab-updater]
    refs:
      tuf: ["note: not in 1.0.37. §1.5.2 'Slow retrieval attacks' removed by commit f9122f1 (J. Lock, 2020-09-08), PR #111, first released in v1.0.7 (last listed in v1.0.6)"]
      uptane: ["§4.3.2 'Slow retrieval attack'", "§5.4 'All ECUs SHALL monitor the download speed of ... image binaries to detect and respond to a slow retrieval attack' (SHALL since 2.0.0; alert to Director SHOULD; no numeric threshold)"]
      cra: ["Annex I Part I (2)(h) availability; resilience against denial-of-service attacks"]
      verified: true
    spec_status:
      tuf: "not required since v1.0.7"
    expected: block
    coverage: {}
    bench: [slow-artifact, ab:net-slow]

  - id: OTA-DOS-05
    title: Malicious mirror prevents updates (no fallback)
    class: availability
    property: availability with partially hostile infrastructure
    attacker: net
    ecosystems: [tuf, uptane]
    refs:
      tuf: ["§1.5.2 'Malicious mirrors preventing updates'", "§2.1.5 mirrors role, §2.2, §4.7 mirrors.json; no §5 client step"]
      suit: ["≈ THREAT.NET.REDIRECT → REQ.SEC.AUTH.REMOTE_LOC"]
