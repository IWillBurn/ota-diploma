 с (pilot-ab-20261101-003715)</title></path><text x='288.0' y='212.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>0–1 с</text><text x='222.0' y='238.0' font-family='Arial, Helvetica, sans-serif' font-size='11.5' fill='#0b0b0b' text-anchor='end' font-weight='normal'>ext2 (без журнала)</text><text x='236.0' y='238.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>окна нет</text><text x='222.0' y='264.0' font-family='Arial, Helvetica, sans-serif' font-size='11.5' fill='#0b0b0b' text-anchor='end' font-weight='normal'>vfat (без журнала)</text><text x='236.0' y='264.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>окна нет</text><text x='222.0' y='290.0' font-family='Arial, Helvetica, sans-serif' font-size='11.5' fill='#0b0b0b' text-anchor='end' font-weight='normal'>UEFI, ESP (vfat)</text><text x='236.0' y='290.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>окна нет</text><text x='222.0' y='316.0' font-family='Arial, Helvetica, sans-serif' font-size='11.5' fill='#52514e' text-anchor='end' font-weight='normal'>ext4 + запись на месте</text><text x='236.0' y='316.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>окна нет</text><text x='222.0' y='342.0' font-family='Arial, Helvetica, sans-serif' font-size='11.5' fill='#52514e' text-anchor='end' font-weight='normal'>ext2 + запись на месте</text><text x='236.0' y='342.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>окна нет</text><text x='222.0' y='368.0' font-family='Arial, Helvetica, sans-serif' font-size='11.5' fill='#52514e' text-anchor='end' font-weight='normal'>vfat + запись на месте</text><text x='236.0' y='368.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>окна нет</text><text x='222.0' y='394.0' font-family='Arial, Helvetica, sans-serif' font-size='11.5' fill='#52514e' text-anchor='end' font-weight='normal'>UEFI ESP + запись на месте</text><text x='236.0' y='394.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>окна нет</text><text x='16.0' y='448.0' font-family='Arial, Helvetica, sans-serif' font-size='10.5' fill='#52514e' text-anchor='start' font-weight='normal'>Метки после установки: 0, 1, 2, 3, 4, 5, 6, 8, 10 с и далее; для ext4 по умолчанию окно лежит между 4 и 5 с.</text><text x='16.0' y='466.0' font-family='Arial, Helvetica, sans-serif' font-size='10.5' fill='#52514e' text-anchor='start' font-weight='normal'>Окно задаёт период фонового сброса (dirty_writeback), а не commit= и не dirty_expire; без журнала окна нет.</text></svg>
