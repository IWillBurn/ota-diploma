<svg xmlns='http://www.w3.org/2000/svg' width='766' height='496' viewBox='0 0 766 496' role='img' aria-label='Окно, в котором GRUB видит старое состояние после успешной установки'><title>Окно, в котором GRUB видит старое состояние после успешной установки</title><rect width='100%' height='100%' fill='#fcfcfb'/><text x='16.0' y='24.0' font-family='Arial, Helvetica, sans-serif' font-size='14' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Рис. 4.2. Сколько секунд после «succeeded» GRUB видит старое состояние A/B</text><text x='16.0' y='42.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>длина столбца — первая метка, на которой GRUB видит новое состояние; подпись — интервал</text><line x1='230' y1='62' x2='230' y2='400' stroke='#e4e3df' stroke-width='1'/><text x='230.0' y='58.0' font-family='Arial, Helvetica, sans-serif' font-size='10.5' fill='#8a8984' text-anchor='middle' font-weight='normal'>0</text><line x1='282' y1='62' x2='282' y2='400' stroke='#e4e3df' stroke-width='1'/><text x='282.0' y='58.0' font-family='Arial, Helvetica, sans-serif' font-size='10.5' fill='#8a8984' text-anchor='middle' font-weight='normal'>1</text><line x1='334' y1='62' x2='334' y2='400' stroke='#e4e3df' stroke-width='1'/><text x='334.0' y='58.0' font-family='Arial, Helvetica, sans-serif' font-size='10.5' fill='#8a8984' text-anchor='middle' font-weight='normal'>2</text><line x1='386' y1='62' x2='386' y2='400' stroke='#e4e3df' stroke-width='1'/><text x='386.0' y='58.0' font-family='Arial, Helvetica, sans-serif' font-size='10.5' fill='#8a8984' text-anchor='middle' font-weight='normal'>3</text><line x1='438' y1='62' x2='438' y2='400' stroke='#e4e3df' stroke-width='1'/><text x='438.0' y='58.0' font-family='Arial, Helvetica, sans-serif' font-size='10.5' fill='#8a8984' text-anchor='middle' font-weight='normal'>4</text><line x1='490' y1='62' x2='490' y2='400' stroke='#e4e3df' stroke-width='1'/><text x='490.0' y='58.0' font-fam