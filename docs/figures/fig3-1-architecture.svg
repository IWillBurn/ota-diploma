<svg xmlns='http://www.w3.org/2000/svg' width='980' height='560' viewBox='0 0 980 560' role='img' aria-label='Рис. 3.1 — архитектура стенда otabench'><title>Рис. 3.1 — архитектура стенда otabench</title><rect width='100%' height='100%' fill='#fcfcfb'/><defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#8a8984'/></marker></defs><text x='20.0' y='28.0' font-family='Arial, Helvetica, sans-serif' font-size='15' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Стенд otabench: слои и каналы</text><g><title>catalog/threats.yaml</title><rect x='20' y='50' width='300' height='70' rx='6' fill='#ebf1f8' stroke='#93bae8'/><text x='30.0' y='69.0' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Каталог угроз</text><text x='30.0' y='86.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>40 угроз, трассировка к TUF, Uptane, SUIT,</text><text x='30.0' y='101.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>CRA, UN R156, ФСТЭК; JSON Schema</text></g><line x1='170' y1='120' x2='170' y2='142' stroke='#8a8984' stroke-width='1.5' marker-end='url(#arr)'/><g><title>scenarios.py, pilot_ab.py</title><rect x='20' y='142' width='300' height='70' rx='6' fill='#ebf1f8' stroke='#93bae8'/><text x='30.0' y='161.0' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Шаблоны сценариев</text><text x='30.0' y='178.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>21 сценарий клиентов; 7 системных;</text><text x='30.0' y='193.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>окно, перестановки, воспроизведение</text></g><line x1='170' y1='212' x2='170' y2='234' stroke='#8a8984' stroke-width='1.5' marker-end='url(#arr)'/><g><title>server.py, build_*_image.py</title><rect x='20' y='234' width='300' height='70' rx='6' fill='#ebf1f8' stroke='#93bae8'/><text x='30.0' y='253.0' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Драйверы протоколов</text><text x='30.0' y='270.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>TUF: симулятор репозитория;</text><text x='30.0' y='285.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>RAUC: бандлы; SWUpdate: .swu</text></g><line x1='170' y1='304' x2='170' y2='326' stroke='#8a8984' stroke-width='1.5' marker-end='url(#arr)'/><g><title>clients.yaml, updaters/*.yaml</title><rect x='20' y='326' width='300' height='70' rx='6' fill='#ebf1f8' stroke='#93bae8'/><text x='30.0' y='345.0' font-family='Arial, Helvetica, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Адаптеры реализаций</text><text x='30.0' y='362.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>v1: CLI init/refresh/download;</text><text x='30.0' y='377.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>v2: YAML с командами в госте</text></g><text x='20.0' y='426.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>Оракулы и вердикты: PASS / FAIL / PARTIAL / ERROR;</text><text x='20.0' y='442.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>уровень ОС: OK / DEGRADED / INCONSISTENT / BRICK</text><g><title>испытуемая система, уровень процесса</title><rect x='650' y='60' width='310' height='110' rx=