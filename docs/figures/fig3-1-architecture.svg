'642' y2='310' stroke='#8a8984' stroke-width='1.5' marker-end='url(#arr)'/><line x1='330' y1='110' x2='606' y2='110' stroke='#2a78d6' stroke-width='2' marker-end='url(#arr)'/><text x='345.0' y='103.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='bold'>управление →</text><text x='345.0' y='125.0' font-family='Arial, Helvetica, sans-serif' font-size='10' fill='#52514e' text-anchor='start' font-weight='normal'>запуск, init/refresh/download; install, status</text><line x1='330' y1='170' x2='606' y2='170' stroke='#eb6834' stroke-width='2' marker-end='url(#arr)'/><text x='345.0' y='163.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='bold'>данные →</text><text x='345.0' y='185.0' font-family='Arial, Helvetica, sans-serif' font-size='10' fill='#52514e' text-anchor='start' font-weight='normal'>сервер-нарушитель: подмена, повтор, поток, обрыв</text><line x1='338' y1='230' x2='612' y2='230' stroke='#2a78d6' stroke-width='2' marker-start='url(#arr)'/><text x='345.0' y='223.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='bold'>← наблюдение</text><text x='345.0' y='245.0' font-family='Arial, Helvetica, sans-serif' font-size='10' fill='#52514e' text-anchor='start' font-weight='normal'>файлы хранилища, status, строки загрузчика</text><line x1='330' y1='290' x2='606' y2='290' stroke='#eb6834' stroke-width='2' marker-end='url(#arr)'/><text x='345.0' y='283.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='bold'>сбои →</text><text x='345.0' y='305.0' font-family='Arial, Helvetica, sans-serif' font-size='10' fill='#52514e' text-anchor='start' font-weight='normal'>kill по событию; QMP quit; журнал записей</text><text x='345.0' y='420.0' font-family='Arial, Helvetica, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>